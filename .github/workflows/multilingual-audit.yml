name: Multilingual SEO Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: yupitek_official_web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: yupitek_official_web
        run: npx playwright install --with-deps chromium

      - name: Build website
        working-directory: yupitek_official_web
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --gc --cleanDestinationDir

      - name: Start Hugo server
        working-directory: yupitek_official_web
        run: hugo server --bind 0.0.0.0 --port 1313 --disableLiveReload --noHTTPCache &

      - name: Wait for Hugo to be ready
        working-directory: yupitek_official_web
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:1313/en/ | grep -q "200" && break
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: yupitek_official_web
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: yupitek_official_web/playwright-report/
          retention-days: 30

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: audit

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          cd yupitek_official_web
          hugo --minify --gc --cleanDestinationDir

      - name: Deploy to Cloudflare Pages
        run: |
          cd yupitek_official_web
          npx wrangler@3 pages deploy public --project-name=yupitek --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
