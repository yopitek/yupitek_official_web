baseURL = "https://yupitek.com/"
title = "Yopitek Ltd | 榆閤科技有限公司"
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = true
enableRobotsTXT = false
enableEmoji = true
hasCJKLanguage = true
theme = "blowfish"

[outputs]
  home    = ["HTML", "RSS", "JSON", "llms"]
  section = ["HTML", "RSS"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[services.googleAnalytics]
  id = "G-XXXXXXXXXX"  # 待 user 建立 GA4 property 後替換（Blowfish analytics/ga.html 模板會讀取此值）

[taxonomies]
  brand    = "brands"
  category = "categories"
  tag      = "tags"
  series   = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[related]
  includeNewer = true
  threshold = 50
