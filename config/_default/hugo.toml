disableAliases = true
disableKinds = ["RSS"]
baseURL = "https://yupitek.com/"
title = "Yopitek Ltd | 榆閤科技有限公司"
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = true
enableRobotsTXT = false
enableEmoji = true
hasCJKLanguage = true
theme = "blowfish"

[outputs]
  home    = ["HTML", "JSON", "llms"]
  section = ["HTML"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[taxonomies]
  brand    = "brands"
  category = "categories"
  tag      = "tags"
  series   = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[related]
  includeNewer = true
  threshold = 50

