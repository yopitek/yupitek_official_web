  "Low power + in-kernel driver; no manual compile needed. Recommends powered USB hub for high-power cards to avoid resets.": "低消費電力でカーネル内蔵ドライバーのため、手動ビルドは不要です。高出力カードにはリセット防止のためセルフパワーの USB ハブを推奨します。"
