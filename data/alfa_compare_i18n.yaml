  ? "RTL8812AU — most mature monitor mode & packet injection on Kali; 100% injection on both bands on GX10 (kernel 6.17). In-kernel rtw88_8812au since 6.13. Tip: On older kernels, use the aircrack-ng DKMS driver pinned to stable commit 63cf0b4."
  : "RTL8812AU — Kali에서 모니터 모드와 패킷 인젝션 지원이 가장 성숙함. GX10(kernel 6.17)에서 두 대역 모두 인젝션 성공률 100%. 커널 내장 rtw88_8812au 드라이버는 6.13부터 제공. 팁: 오래된 커널에서는 안정 commit 63cf0b4로 고정한 aircrack-ng DKMS 드라이버를 사용하세요."
  ? "MT7921AUN — in-kernel Linux driver since 5.18, 6 GHz band (verified on AXML; AXM untested), Bluetooth 5.2. Note: packet injection fails on stock kernel 6.17 (mac80211 regression since 6.16), so not for pentesting. Form factors: AXML has a detachable USB-C connector and a single-antenna body with dual outputs; AXM has a built-in L-shaped USB-A format."
  : "MT7921AUN — Linux 커널 내장 드라이버는 5.18부터 제공. 6 GHz 대역 지원(AXML에서 확인, AXM은 미시험), 블루투스 5.2. 참고: 기본 kernel 6.17에서는 패킷 인젝션이 실패하므로(6.16 이후의 mac80211 회귀) 침투 테스트에는 적합하지 않습니다. 폼팩터: AXML은 분리형 USB-C 커넥터와 듀얼 출력을 갖춘 단일 안테나 본체이며, AXM은 일체형 L자 USB-A 형태입니다."
  ? "MT7612U — plug-and-play AP mode support via native hostapd in Linux kernel. Unlike Realtek adapters which require problematic custom hostapd builds, MediaTek is seamless and stable for Rogue AP / Evil Twin simulation."
  : "MT7612U — Linux 커널 기본 hostapd로 플러그 앤 플레이 AP 모드를 지원합니다. 별도 빌드한 hostapd가 필요하고 문제가 잦은 Realtek 어댑터와 달리 MediaTek은 매끄럽고 안정적이어서 Rogue AP / Evil Twin 시뮬레이션에 적합합니다."
  "MT7612U — in-kernel since kernel 4.19, zero driver setup on Ubuntu / Debian / Fedora. Most hassle-free Linux experience.": "MT7612U — 커널 4.19부터 내장되어 Ubuntu / Debian / Fedora에서 별도 드라이버 설정이 필요 없습니다. 가장 손쉬운 Linux 환경입니다."
  ? "Low power consumption + in-kernel driver makes it ideal for Raspberry Pi. Note: High-power models (ACH, AXML) will draw up to 3.6W and require a powered USB hub to prevent voltage drops and connection resets on Pi."
  : "낮은 소비 전력과 커널 내장 드라이버 덕분에 Raspberry Pi에 적합합니다. 참고: 고출력 모델(ACH, AXML)은 최대 3.6W를 소비하므로 Pi에서 전압 강하와 연결 재설정을 막으려면 외부 전원 USB 허브가 필요합니다."
  "RTL8811AU — affordable entry point with monitor mode and packet injection support. Single antenna, compact design.": "RTL8811AU — 모니터 모드와 패킷 인젝션을 지원하는 입문용 어댑터입니다. 단일 안테나의 소형 설계입니다."
  "Ultra-thin nano body at only 10.5g. WiFi 6 (1800 Mbps), USB-A. Great for business travel, Windows-focused.": "초박형 나노 본체로 무게는 10.5g에 불과합니다. WiFi 6(1800 Mbps), USB-A. 출장용으로 적합하며 Windows 중심 환경에 맞습니다."
  ? "RTL8821CU — dual-mode WiFi 5 + Bluetooth 4.2 combo. Nano form factor. Best for desktops needing quick wireless + BT without PCIe slot."
  : "RTL8821CU — WiFi 5와 블루투스 4.2를 결합한 듀얼 모드 어댑터입니다. 나노 폼팩터. PCIe 슬롯 없이 무선과 블루투스를 간편하게 추가하려는 데스크톱에 적합합니다."
  ? "ACH has good macOS support via third-party driver. AXML's MT7921AUN has community macOS support. Always verify macOS version compatibility. Intel Macs have better driver legacy support than M-series."
  : "ACH는 서드파티 드라이버로 macOS에서 잘 동작합니다. AXML의 MT7921AUN은 커뮤니티 macOS 지원이 있습니다. 항상 macOS 버전 호환성을 확인하세요. Intel Mac은 M 시리즈보다 기존 드라이버 지원이 더 충실합니다."
