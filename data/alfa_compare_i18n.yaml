  ? "RTL8812AU — most mature monitor mode & packet injection on Kali; 100% injection on both bands on GX10 (kernel 6.17). In-kernel rtw88_8812au since 6.13. Tip: On older kernels, use the aircrack-ng DKMS driver pinned to stable commit 63cf0b4."
  : "RTL8812AU — el monitor mode y la packet injection más maduros en Kali; 100 % de injection en ambas bandas en el GX10 (kernel 6.17). Controlador rtw88_8812au en el kernel desde la 6.13. Consejo: en kernels más antiguos, use el controlador DKMS de aircrack-ng fijado al commit estable 63cf0b4."
  ? "MT7921AUN — in-kernel Linux driver since 5.18, 6 GHz band (verified on AXML; AXM untested), Bluetooth 5.2. Note: packet injection fails on stock kernel 6.17 (mac80211 regression since 6.16), so not for pentesting. Form factors: AXML has a detachable USB-C connector and a single-antenna body with dual outputs; AXM has a built-in L-shaped USB-A format."
  : "MT7921AUN — controlador Linux en el kernel desde la 5.18, banda de 6 GHz (verificada en el AXML; AXM sin probar), Bluetooth 5.2. Nota: la packet injection falla en el kernel estándar 6.17 (regresión de mac80211 desde la 6.16), por lo que no es apto para pentesting. Formatos: el AXML tiene un conector USB-C desmontable y un cuerpo de una sola antena con dos salidas; el AXM tiene un formato USB-A en L integrado."
  ? "MT7612U — plug-and-play AP mode support via native hostapd in Linux kernel. Unlike Realtek adapters which require problematic custom hostapd builds, MediaTek is seamless and stable for Rogue AP / Evil Twin simulation."
  : "MT7612U — compatibilidad con el modo AP plug-and-play mediante el hostapd nativo del kernel de Linux. A diferencia de los adaptadores Realtek, que requieren compilaciones personalizadas de hostapd problemáticas, MediaTek funciona sin fricciones y de forma estable para simular Rogue AP / Evil Twin."
  "MT7612U — in-kernel since kernel 4.19, zero driver setup on Ubuntu / Debian / Fedora. Most hassle-free Linux experience.": "MT7612U — en el kernel desde la versión 4.19, sin instalar controladores en Ubuntu / Debian / Fedora. La experiencia más sencilla en Linux."
  ? "Low power consumption + in-kernel driver makes it ideal for Raspberry Pi. Note: High-power models (ACH, AXML) will draw up to 3.6W and require a powered USB hub to prevent voltage drops and connection resets on Pi."
  : "El bajo consumo y el controlador en el kernel lo hacen ideal para Raspberry Pi. Nota: los modelos de alta potencia (ACH, AXML) consumen hasta 3.6W y requieren un hub USB alimentado para evitar caídas de tensión y reinicios de conexión en la Pi."
  "RTL8811AU — affordable entry point with monitor mode and packet injection support. Single antenna, compact design.": "RTL8811AU — opción de entrada asequible con compatibilidad con monitor mode y packet injection. Antena única, diseño compacto."
  "Ultra-thin nano body at only 10.5g. WiFi 6 (1800 Mbps), USB-A. Great for business travel, Windows-focused.": "Cuerpo nano ultradelgado de solo 10.5g. WiFi 6 (1800 Mbps), USB-A. Adecuado para viajes de negocios, orientado a Windows."
  ? "RTL8821CU — dual-mode WiFi 5 + Bluetooth 4.2 combo. Nano form factor. Best for desktops needing quick wireless + BT without PCIe slot."
  : "RTL8821CU — combo de modo dual WiFi 5 + Bluetooth 4.2. Formato nano. Ideal para equipos de escritorio que necesitan WiFi + BT rápidamente sin ranura PCIe."
  ? "ACH has good macOS support via third-party driver. AXML's MT7921AUN has community macOS support. Always verify macOS version compatibility. Intel Macs have better driver legacy support than M-series."
  : "El ACH tiene buena compatibilidad con macOS mediante un controlador de terceros. El MT7921AUN del AXML cuenta con soporte de la comunidad en macOS. Verifique siempre la compatibilidad con su versión de macOS. Los Mac con Intel tienen mejor legado de controladores que la serie M."
