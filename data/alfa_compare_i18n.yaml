  ? "RTL8812AU — most mature monitor mode & packet injection on Kali; 100% injection on both bands on GX10 (kernel 6.17). In-kernel rtw88_8812au since 6.13. Tip: On older kernels, use the aircrack-ng DKMS driver pinned to stable commit 63cf0b4."
  : "RTL8812AU — Kali 上でのモニターモードとパケットインジェクションの実績が最も豊富。GX10（kernel 6.17）では両バンドでインジェクション成功率 100%。カーネル内蔵の rtw88_8812au ドライバーは 6.13 以降で利用可能。ヒント：古いカーネルでは、安定版 commit 63cf0b4 に固定した aircrack-ng の DKMS ドライバーを使用してください。"
  ? "MT7921AUN — in-kernel Linux driver since 5.18, 6 GHz band (verified on AXML; AXM untested), Bluetooth 5.2. Note: packet injection fails on stock kernel 6.17 (mac80211 regression since 6.16), so not for pentesting. Form factors: AXML has a detachable USB-C connector and a single-antenna body with dual outputs; AXM has a built-in L-shaped USB-A format."
  : "MT7921AUN — Linux カーネル内蔵ドライバーは 5.18 以降で利用可能。6 GHz 帯に対応（AXML で確認済み、AXM は未試験）、Bluetooth 5.2。注意：標準 kernel 6.17 ではパケットインジェクションが失敗します（6.16 以降の mac80211 のリグレッション）。そのためペネトレーションテストには適しません。形状の違い：AXML は着脱式 USB-C コネクターで、単一アンテナ筐体に 2 系統の出力を備えます。AXM は L 字型の USB-A 一体型です。"
  ? "MT7612U — plug-and-play AP mode support via native hostapd in Linux kernel. Unlike Realtek adapters which require problematic custom hostapd builds, MediaTek is seamless and stable for Rogue AP / Evil Twin simulation."
  : "MT7612U — Linux カーネル標準の hostapd でプラグアンドプレイの AP モードに対応。独自ビルドの hostapd が必要で不具合の出やすい Realtek 製アダプターと異なり、MediaTek はスムーズで安定しており、Rogue AP / Evil Twin のシミュレーションに適しています。"
  "MT7612U — in-kernel since kernel 4.19, zero driver setup on Ubuntu / Debian / Fedora. Most hassle-free Linux experience.": "MT7612U — カーネル 4.19 以降で内蔵。Ubuntu / Debian / Fedora ではドライバーの設定は不要で、最も手間のかからない Linux 環境です。"
  ? "Low power consumption + in-kernel driver makes it ideal for Raspberry Pi. Note: High-power models (ACH, AXML) will draw up to 3.6W and require a powered USB hub to prevent voltage drops and connection resets on Pi."
  : "低消費電力とカーネル内蔵ドライバーの組み合わせは Raspberry Pi に最適です。注意：高出力モデル（ACH、AXML）は最大 3.6W を消費するため、Pi での電圧低下や接続リセットを防ぐにはセルフパワーの USB ハブが必要です。"
  "RTL8811AU — affordable entry point with monitor mode and packet injection support. Single antenna, compact design.": "RTL8811AU — モニターモードとパケットインジェクションに対応した手頃な入門モデル。シングルアンテナのコンパクト設計です。"
  "Ultra-thin nano body at only 10.5g. WiFi 6 (1800 Mbps), USB-A. Great for business travel, Windows-focused.": "厚さを抑えたナノサイズで重量はわずか 10.5g。WiFi 6（1800 Mbps）、USB-A。出張に適しており、Windows 利用向けです。"
  ? "RTL8821CU — dual-mode WiFi 5 + Bluetooth 4.2 combo. Nano form factor. Best for desktops needing quick wireless + BT without PCIe slot."
  : "RTL8821CU — WiFi 5 と Bluetooth 4.2 のデュアルモード一体型。ナノサイズ。PCIe スロットがなく、手軽に無線と Bluetooth を追加したいデスクトップ PC に適しています。"
  ? "ACH has good macOS support via third-party driver. AXML's MT7921AUN has community macOS support. Always verify macOS version compatibility. Intel Macs have better driver legacy support than M-series."
  : "ACH はサードパーティ製ドライバーにより macOS で良好に動作します。AXML の MT7921AUN にはコミュニティ版の macOS 対応があります。必ず macOS バージョンとの互換性をご確認ください。Intel Mac は M シリーズよりも過去のドライバー資産が充実しています。"
