  ? "ACH = best monitor mode; ACM = easiest kernel support. For VMs: Configure VM to use USB 3.0 (xHCI) controller to prevent drops."
  : "ACH = mejor monitor mode; ACM = compatibilidad de kernel más sencilla. En máquinas virtuales: configure la VM con un controlador USB 3.0 (xHCI) para evitar desconexiones."
  "MT7612U in-kernel since 4.19; MT7921AUN since 5.18": "MT7612U en el kernel desde la 4.19; MT7921AUN desde la 5.18"
  "Low power + in-kernel driver; no manual compile needed. Recommends powered USB hub for high-power cards to avoid resets.": "Bajo consumo + controlador en el kernel; no requiere compilación manual. Se recomienda un hub USB alimentado para tarjetas de alta potencia, a fin de evitar reinicios."
  "WiFi 6 performance; EACS adds Bluetooth combo": "Rendimiento WiFi 6; el EACS añade un combo con Bluetooth"
  ? "Third-party drivers available; verify macOS version. Intel Macs have legacy drivers; Apple Silicon (M1/M2/M3) has restricted experimental support."
  : "Hay controladores de terceros disponibles; verifique la versión de macOS. Los Mac con Intel tienen controladores heredados; Apple Silicon (M1/M2/M3) solo tiene compatibilidad experimental restringida."
  "RTL8812AU & RTL8811AU have NetHunter support; OTG adapter & custom kernel compilation required.": "RTL8812AU y RTL8811AU son compatibles con NetHunter; se requiere un adaptador OTG y compilar un kernel personalizado."
