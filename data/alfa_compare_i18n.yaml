  ? "RTL8812AU — most mature monitor mode & packet injection on Kali; 100% injection on both bands on GX10 (kernel 6.17). In-kernel rtw88_8812au since 6.13. Tip: On older kernels, use the aircrack-ng DKMS driver pinned to stable commit 63cf0b4."
  : "RTL8812AU — le monitor mode et la packet injection les plus aboutis sous Kali ; 100 % d'injection sur les deux bandes sur le GX10 (noyau 6.17). Pilote rtw88_8812au dans le noyau depuis la 6.13. Astuce : sur les noyaux plus anciens, utilisez le pilote DKMS d'aircrack-ng figé sur le commit stable 63cf0b4."
  ? "MT7921AUN — in-kernel Linux driver since 5.18, 6 GHz band (verified on AXML; AXM untested), Bluetooth 5.2. Note: packet injection fails on stock kernel 6.17 (mac80211 regression since 6.16), so not for pentesting. Form factors: AXML has a detachable USB-C connector and a single-antenna body with dual outputs; AXM has a built-in L-shaped USB-A format."
  : "MT7921AUN — pilote Linux dans le noyau depuis la 5.18, bande 6 GHz (vérifiée sur l'AXML ; AXM non testé), Bluetooth 5.2. Remarque : la packet injection échoue sur le noyau standard 6.17 (régression mac80211 depuis la 6.16), il ne convient donc pas au pentest. Formats : l'AXML dispose d'un connecteur USB-C amovible et d'un boîtier à une seule antenne avec deux sorties ; l'AXM présente un format USB-A en L intégré."
  ? "MT7612U — plug-and-play AP mode support via native hostapd in Linux kernel. Unlike Realtek adapters which require problematic custom hostapd builds, MediaTek is seamless and stable for Rogue AP / Evil Twin simulation."
  : "MT7612U — prise en charge du mode AP en plug-and-play via le hostapd natif du noyau Linux. Contrairement aux adaptateurs Realtek qui nécessitent des builds hostapd personnalisés problématiques, MediaTek fonctionne de façon fluide et stable pour la simulation de Rogue AP / Evil Twin."
  "MT7612U — in-kernel since kernel 4.19, zero driver setup on Ubuntu / Debian / Fedora. Most hassle-free Linux experience.": "MT7612U — dans le noyau depuis la version 4.19, aucune installation de pilote sous Ubuntu / Debian / Fedora. L'expérience Linux la plus simple."
  ? "Low power consumption + in-kernel driver makes it ideal for Raspberry Pi. Note: High-power models (ACH, AXML) will draw up to 3.6W and require a powered USB hub to prevent voltage drops and connection resets on Pi."
  : "Faible consommation + pilote dans le noyau : idéal pour le Raspberry Pi. Remarque : les modèles à forte puissance (ACH, AXML) consomment jusqu'à 3.6W et nécessitent un hub USB alimenté pour éviter les chutes de tension et les coupures de connexion sur le Pi."
  "RTL8811AU — affordable entry point with monitor mode and packet injection support. Single antenna, compact design.": "RTL8811AU — entrée de gamme abordable avec prise en charge du monitor mode et de la packet injection. Antenne unique, conception compacte."
  "Ultra-thin nano body at only 10.5g. WiFi 6 (1800 Mbps), USB-A. Great for business travel, Windows-focused.": "Boîtier nano ultra-fin de seulement 10.5g. WiFi 6 (1800 Mbps), USB-A. Idéal pour les déplacements professionnels, orienté Windows."
  ? "RTL8821CU — dual-mode WiFi 5 + Bluetooth 4.2 combo. Nano form factor. Best for desktops needing quick wireless + BT without PCIe slot."
  : "RTL8821CU — combo bi-mode WiFi 5 + Bluetooth 4.2. Format nano. Idéal pour les PC de bureau nécessitant rapidement WiFi + BT sans emplacement PCIe."
  ? "ACH has good macOS support via third-party driver. AXML's MT7921AUN has community macOS support. Always verify macOS version compatibility. Intel Macs have better driver legacy support than M-series."
