  ? "RTL8812AU — most mature monitor mode & packet injection on Kali; 100% injection on both bands on GX10 (kernel 6.17). In-kernel rtw88_8812au since 6.13. Tip: On older kernels, use the aircrack-ng DKMS driver pinned to stable commit 63cf0b4."
  : "RTL8812AU — наиболее зрелая поддержка режима монитора и инъекции пакетов в Kali; 100% инъекция в обоих диапазонах на GX10 (ядро 6.17). Драйвер rtw88_8812au входит в ядро начиная с 6.13. Совет: на более старых ядрах используйте DKMS-драйвер aircrack-ng, закреплённый на стабильном коммите 63cf0b4."
  ? "MT7921AUN — in-kernel Linux driver since 5.18, 6 GHz band (verified on AXML; AXM untested), Bluetooth 5.2. Note: packet injection fails on stock kernel 6.17 (mac80211 regression since 6.16), so not for pentesting. Form factors: AXML has a detachable USB-C connector and a single-antenna body with dual outputs; AXM has a built-in L-shaped USB-A format."
  : "MT7921AUN — драйвер Linux в ядре начиная с 5.18, диапазон 6 GHz (проверено на AXML; AXM не проверялся), Bluetooth 5.2. Примечание: инъекция пакетов не работает на штатном ядре 6.17 (регрессия mac80211 начиная с 6.16), поэтому для пентеста не подходит. Конструктивные варианты: у AXML съёмный разъём USB-C и корпус с одной антенной и двумя выходами; у AXM встроенный Г-образный формат с USB-A."
  ? "MT7612U — plug-and-play AP mode support via native hostapd in Linux kernel. Unlike Realtek adapters which require problematic custom hostapd builds, MediaTek is seamless and stable for Rogue AP / Evil Twin simulation."
  : "MT7612U — поддержка режима AP по принципу plug and play через штатный hostapd в ядре Linux. В отличие от адаптеров Realtek, которым нужны проблемные кастомные сборки hostapd, MediaTek работает без сбоев и стабильно для моделирования Rogue AP / Evil Twin."
  "MT7612U — in-kernel since kernel 4.19, zero driver setup on Ubuntu / Debian / Fedora. Most hassle-free Linux experience.": "MT7612U — в ядре начиная с версии 4.19, установка драйвера в Ubuntu / Debian / Fedora не требуется. Самый простой вариант для Linux."
  ? "Low power consumption + in-kernel driver makes it ideal for Raspberry Pi. Note: High-power models (ACH, AXML) will draw up to 3.6W and require a powered USB hub to prevent voltage drops and connection resets on Pi."
  : "Низкое энергопотребление и драйвер в ядре делают его удобным для Raspberry Pi. Примечание: мощные модели (ACH, AXML) потребляют до 3.6W и требуют USB-концентратор с внешним питанием, чтобы избежать просадок напряжения и сбросов соединения на Pi."
  "RTL8811AU — affordable entry point with monitor mode and packet injection support. Single antenna, compact design.": "RTL8811AU — доступная модель для начала работы с поддержкой режима монитора и инъекции пакетов. Одна антенна, компактный корпус."
  "Ultra-thin nano body at only 10.5g. WiFi 6 (1800 Mbps), USB-A. Great for business travel, Windows-focused.": "Сверхтонкий нано-корпус, всего 10.5g. Wi-Fi 6 (1800 Mbps), USB-A. Подходит для командировок и работы в Windows."
  ? "RTL8821CU — dual-mode WiFi 5 + Bluetooth 4.2 combo. Nano form factor. Best for desktops needing quick wireless + BT without PCIe slot."
  : "RTL8821CU — двухрежимный комбинированный адаптер Wi-Fi 5 + Bluetooth 4.2. Нано-формат. Подходит для настольных ПК, которым нужны беспроводная сеть и BT без слота PCIe."
  ? "ACH has good macOS support via third-party driver. AXML's MT7921AUN has community macOS support. Always verify macOS version compatibility. Intel Macs have better driver legacy support than M-series."
  : "Для ACH есть хорошая поддержка macOS через сторонний драйвер. Для MT7921AUN в AXML есть поддержка macOS от сообщества. Всегда проверяйте совместимость с версией macOS. У Mac на Intel драйверов больше, чем у Mac серии M."
