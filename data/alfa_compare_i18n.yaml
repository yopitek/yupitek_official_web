  ? "RTL8812AU — most mature monitor mode & packet injection on Kali; 100% injection on both bands on GX10 (kernel 6.17). In-kernel rtw88_8812au since 6.13. Tip: On older kernels, use the aircrack-ng DKMS driver pinned to stable commit 63cf0b4."
  : "RTL8812AU — der ausgereifteste Monitor Mode und Packet Injection unter Kali; 100 % Injection auf beiden Bändern am GX10 (Kernel 6.17). Treiber rtw88_8812au im Kernel seit 6.13. Tipp: Bei älteren Kernels den aircrack-ng-DKMS-Treiber verwenden, festgelegt auf den stabilen Commit 63cf0b4."
  ? "MT7921AUN — in-kernel Linux driver since 5.18, 6 GHz band (verified on AXML; AXM untested), Bluetooth 5.2. Note: packet injection fails on stock kernel 6.17 (mac80211 regression since 6.16), so not for pentesting. Form factors: AXML has a detachable USB-C connector and a single-antenna body with dual outputs; AXM has a built-in L-shaped USB-A format."
  : "MT7921AUN — Linux-Treiber im Kernel seit 5.18, 6-GHz-Band (an AXML verifiziert; AXM ungetestet), Bluetooth 5.2. Hinweis: Packet Injection schlägt unter dem Standard-Kernel 6.17 fehl (mac80211-Regression seit 6.16), daher nicht für Pentesting geeignet. Bauformen: AXML hat einen abnehmbaren USB-C-Anschluss und ein Gehäuse mit einer Antenne und zwei Ausgängen; AXM hat ein integriertes L-förmiges USB-A-Format."
  ? "MT7612U — plug-and-play AP mode support via native hostapd in Linux kernel. Unlike Realtek adapters which require problematic custom hostapd builds, MediaTek is seamless and stable for Rogue AP / Evil Twin simulation."
  : "MT7612U — AP-Modus Plug & Play über das native hostapd im Linux-Kernel. Anders als Realtek-Adapter, die problematische angepasste hostapd-Builds erfordern, läuft MediaTek nahtlos und stabil für Rogue-AP-/Evil-Twin-Simulationen."
  "MT7612U — in-kernel since kernel 4.19, zero driver setup on Ubuntu / Debian / Fedora. Most hassle-free Linux experience.": "MT7612U — im Kernel seit Kernel 4.19, keine Treiberinstallation unter Ubuntu / Debian / Fedora. Die unkomplizierteste Linux-Erfahrung."
  ? "Low power consumption + in-kernel driver makes it ideal for Raspberry Pi. Note: High-power models (ACH, AXML) will draw up to 3.6W and require a powered USB hub to prevent voltage drops and connection resets on Pi."
  : "Geringer Stromverbrauch + Treiber im Kernel machen ihn ideal für den Raspberry Pi. Hinweis: Modelle mit hoher Leistung (ACH, AXML) ziehen bis zu 3.6W und benötigen einen aktiven USB-Hub, um Spannungseinbrüche und Verbindungsabbrüche am Pi zu vermeiden."
  "RTL8811AU — affordable entry point with monitor mode and packet injection support. Single antenna, compact design.": "RTL8811AU — günstiger Einstieg mit Unterstützung für Monitor Mode und Packet Injection. Eine Antenne, kompaktes Design."
  "Ultra-thin nano body at only 10.5g. WiFi 6 (1800 Mbps), USB-A. Great for business travel, Windows-focused.": "Ultradünnes Nano-Gehäuse mit nur 10.5g. WiFi 6 (1800 Mbps), USB-A. Gut für Geschäftsreisen, ausgerichtet auf Windows."
  ? "RTL8821CU — dual-mode WiFi 5 + Bluetooth 4.2 combo. Nano form factor. Best for desktops needing quick wireless + BT without PCIe slot."
  : "RTL8821CU — Dual-Mode-Kombination aus WiFi 5 + Bluetooth 4.2. Nano-Bauform. Am besten für Desktop-PCs, die schnell WLAN + BT ohne PCIe-Steckplatz benötigen."
  ? "ACH has good macOS support via third-party driver. AXML's MT7921AUN has community macOS support. Always verify macOS version compatibility. Intel Macs have better driver legacy support than M-series."
  : "ACH hat über einen Drittanbieter-Treiber gute macOS-Unterstützung. Der MT7921AUN des AXML hat Community-Unterstützung unter macOS. Die Kompatibilität mit der macOS-Version stets prüfen. Intel-Macs haben die bessere Treiberhistorie als M-Serie."
