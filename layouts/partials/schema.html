{{ if .IsHome -}}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": {{ site.Home.Permalink | safeURL }},
    "name": "{{ .Site.Title | safeJS }}",
    {{ with .Site.Params.description }}"description": "{{ . | safeJS }}",{{ end }}
    {{ with .Site.Language.Locale }}"inLanguage": "{{ . }}",{{ end }}
    "url": {{ site.Home.Permalink | safeURL }},
    {{ with .Site.Params.keywords }}"keywords": {{ . }},{{ end }}
    "publisher": {
      "@type": "Organization",
      "@id": "https://yupitek.com/#organization",
      "name": "Yopitek Ltd",
      "url": "https://yupitek.com"
    }
  }
  </script>
{{ else }}
  {{- $iso8601 := "2006-01-02T15:04:05-07:00" -}}
  <script type="application/ld+json">
  [
    {{- if eq .Section "blog" -}}
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "articleSection": "{{ (site.GetPage .Section).Title | safeJS }}",
      "name": "{{ .Title | safeJS }}",
      "headline": "{{ .Title | safeJS }}",
      {{ with .Description }}"description": "{{ . | safeJS }}",{{ end }}
      {{ with .Site.Language.Locale }}"inLanguage": "{{ . }}",{{ end }}
      "url" : {{ .Permalink }},
      "author" : {
        "@type": "Person",
        "@id": "https://yupitek.com/authors/benny-lai/#person",
        "name": "Benny Lai",
        "email": "sales@yupitek.com",
        "jobTitle": "Network Solutions Architect",
        "sameAs": [
          "https://www.linkedin.com/in/benny-lai"
        ],
        "knowsAbout": ["WiFi 7", "Enterprise Networking", "Ubiquiti", "ALFA Network", "Network Security"]
      },
      "publisher": {
        "@type": "Organization",
        "@id": "https://yupitek.com/#organization",
        "name": "Yopitek Ltd",
        "url": "https://yupitek.com"
      },
      {{ with .PublishDate }}"copyrightYear": "{{ .Format "2006" }}",{{ end }}
      {{ with .Date }}"dateCreated": "{{ .Format $iso8601 }}",{{ end }}
      {{ with .PublishDate }}"datePublished": "{{ .Format $iso8601 }}",{{ end }}
      {{ with .Lastmod }}"dateModified": "{{ .Format $iso8601 }}",{{ end }}
      {{ if .Keywords }}
      {{ with .Keywords }}"keywords": {{ . }},{{ end }}
      {{ else }}
      {{ with .Params.tags }}"keywords": {{ . }},{{ end }}
      {{ end }}
      "mainEntityOfPage": "true",
      "wordCount": "{{ .WordCount }}"
    }
    {{- end -}}
    {{- if eq .Section "blog" -}},{{- end -}}
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {{- $position := 0 -}}
        {{- range .Ancestors.Reverse -}}
          {{- if not .IsHome -}}
            {{- $position = add $position 1 -}}
            {
              "@type": "ListItem",
              "position": {{ $position }},
              "name": "{{ .Title }}",
              "item": {{ .Permalink }}
            },
          {{- end -}}
        {{- end -}}
        {{- $position = add $position 1 -}}
        {
          "@type": "ListItem",
          "position": {{ $position }},
          "name": "{{ .Title }}",
          "item": {{ .Permalink }}
        }
      ]
    }
    {{- if eq .Section "products" -}}
      {{- $depth := len .Ancestors -}}
      {{- $brandNames := dict "acr" "ACS" "flipperzero" "Flipper Zero" "hak5" "Hak5" "sdrlab" "OpenSourceSDRLab" -}}
      {{- $brandKey := index (split (strings.TrimPrefix "/" .RelPermalink) "/") 2 -}}
      {{- $seller := dict "@type" "Organization" "@id" "https://yupitek.com/#organization" "name" "Yupitek" "url" "https://yupitek.com" -}}
      {{- if and (eq $depth 3) (isset $brandNames $brandKey) -}}
        {{- $product := dict "@context" "https://schema.org" "@type" "Product" "name" .Title "url" .Permalink "brand" (dict "@type" "Brand" "name" (index $brandNames $brandKey)) "inLanguage" .Site.Language.Locale -}}
        {{- with .Description }}{{ $product = merge $product (dict "description" .) }}{{ end -}}
        {{- with .Params.featureimage }}{{ $product = merge $product (dict "image" (. | absURL)) }}{{ end -}}
        ,{{ $product | jsonify | safeJS }}
      {{- else if and (eq $depth 2) (isset $brandNames $brandKey) -}}
        {{- $items := slice -}}
        {{- range $i, $p := .Pages.ByWeight -}}
          {{- $items = $items | append (dict "@type" "ListItem" "position" (add $i 1) "url" $p.Permalink "name" $p.Title) -}}
        {{- end -}}
        ,{{ dict "@context" "https://schema.org" "@type" "CollectionPage" "name" .Title "url" .Permalink "inLanguage" .Site.Language.Locale "publisher" $seller | jsonify | safeJS }}
        ,{{ dict "@context" "https://schema.org" "@type" "ItemList" "name" .Title "numberOfItems" (len $items) "itemListElement" $items | jsonify | safeJS }}
      {{- end -}}
    {{- end -}}
    {{- if and (or (eq .Section "blog") (eq .Section "products")) .Params.faq -}},{{- end -}}
    {{- if and (or (eq .Section "blog") (eq .Section "products")) .Params.faq -}}
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {{- range $i, $item := .Params.faq -}}
        {{- if $i }},{{- end -}}
        {
          "@type": "Question",
          "name": {{ $item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $item.answer | jsonify | safeJS }}
          }
        }
        {{- end -}}
      ]
    }
    {{- end -}}
  ]
  </script>
{{ end }}
