{{ $title := .Get "title" }}
{{ $href := .Get "href" }}
{{ $image := .Get "image" }}
<div class="flex flex-col rounded-lg border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 shadow-sm overflow-hidden">
  {{ if $href }}
  <a href="{{ $href }}" class="block">
    {{ if $image }}
    <div style="height: 160px; overflow: hidden;">
      <img src="{{ $image }}" alt="{{ $title }}" loading="lazy" decoding="async"
           style="width: 100%; height: 160px; object-fit: contain; background: #f8f8f8; display: block;">
    </div>
    {{ end }}
    <div class="p-5">
      <h3 class="text-base font-semibold text-neutral-900 dark:text-neutral-100 mb-2">{{ $title }}</h3>
      {{ with .Inner }}<p class="text-sm text-neutral-600 dark:text-neutral-400">{{ . }}</p>{{ end }}
    </div>
  </a>
  {{ else }}
  {{ if $image }}
  <div style="height: 160px; overflow: hidden;">
    <img src="{{ $image }}" alt="{{ $title }}" loading="lazy" decoding="async"
         style="width: 100%; height: 160px; object-fit: contain; background: #f8f8f8; display: block;">
  </div>
  {{ end }}
  <div class="p-5">
    <h3 class="text-base font-semibold text-neutral-900 dark:text-neutral-100 mb-2">{{ $title }}</h3>
    {{ with .Inner }}<p class="text-sm text-neutral-600 dark:text-neutral-400">{{ . }}</p>{{ end }}
  </div>
  {{ end }}
</div>
