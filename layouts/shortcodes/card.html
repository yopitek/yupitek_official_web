{{ $title := .Get "title" }}
{{ $href := .Get "href" }}
<div class="flex flex-col rounded-lg border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 p-5 shadow-sm hover:shadow-md transition-shadow">
  {{ if $href }}
  <a href="{{ $href }}" class="block">
    <h3 class="text-base font-semibold text-neutral-900 dark:text-neutral-100 mb-2 hover:text-cyan-500 transition-colors">{{ $title }}</h3>
    {{ with .Inner }}<p class="text-sm text-neutral-600 dark:text-neutral-400">{{ . }}</p>{{ end }}
  </a>
  {{ else }}
  <h3 class="text-base font-semibold text-neutral-900 dark:text-neutral-100 mb-2">{{ $title }}</h3>
  {{ with .Inner }}<p class="text-sm text-neutral-600 dark:text-neutral-400">{{ . }}</p>{{ end }}
  {{ end }}
</div>
