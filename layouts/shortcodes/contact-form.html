<form id="contact-form"
      class="space-y-4 max-w-xl"
      data-worker-url="https://contact.yupitek.com">

  <div>
    <label for="name" class="block text-sm font-medium mb-1">姓名 Name *</label>
    <input type="text" id="name" name="name" required maxlength="100"
           class="w-full rounded-md border border-neutral-300 dark:border-neutral-600
                  px-3 py-2 bg-white dark:bg-neutral-800 focus:outline-none
                  focus:ring-2 focus:ring-cyan-400">
  </div>

  <div>
    <label for="email" class="block text-sm font-medium mb-1">電子信箱 Email *</label>
    <input type="email" id="email" name="email" required maxlength="200"
           class="w-full rounded-md border border-neutral-300 dark:border-neutral-600
                  px-3 py-2 bg-white dark:bg-neutral-800">
  </div>

  <div>
    <label for="subject" class="block text-sm font-medium mb-1">主旨 Subject *</label>
    <select id="subject" name="subject" required
            class="w-full rounded-md border border-neutral-300 dark:border-neutral-600
                   px-3 py-2 bg-white dark:bg-neutral-800">
      <option value="">請選擇 / Please select</option>
      <option value="product-inquiry">產品詢問 Product Inquiry</option>
      <option value="solution-inquiry">投影方案諮詢 Solution Inquiry</option>
      <option value="technical-support">技術支援 Technical Support</option>
      <option value="other">其他 Other</option>
    </select>
  </div>

  <div>
    <label for="message" class="block text-sm font-medium mb-1">訊息內容 Message *</label>
    <textarea id="message" name="message" rows="5" required maxlength="5000"
              class="w-full rounded-md border border-neutral-300 dark:border-neutral-600
                     px-3 py-2 bg-white dark:bg-neutral-800"></textarea>
  </div>

  <!-- Cloudflare Turnstile CAPTCHA -->
  <div class="cf-turnstile" data-sitekey="{{ .Site.Params.turnstileSiteKey }}"></div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <button type="submit"
          class="btn-inquiry w-full sm:w-auto px-8 py-3 rounded-md font-semibold">
    送出訊息 Send Message
  </button>

  <div id="form-success" class="hidden text-green-600 font-medium">
    ✅ 訊息已送出！我們將盡快回覆您。
  </div>
  <div id="form-error" class="hidden text-red-600 font-medium">
    ❌ 送出失敗，請直接 Email：eason@yupitek.com
  </div>
</form>

<script>
document.getElementById('contact-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const data = Object.fromEntries(formData.entries());
  const successEl = document.getElementById('form-success');
  const errorEl = document.getElementById('form-error');

  try {
    const res = await fetch(form.dataset.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      form.reset();
      successEl.classList.remove('hidden');
      errorEl.classList.add('hidden');
    } else {
      throw new Error('Server error');
    }
  } catch (_) {
    errorEl.classList.remove('hidden');
    successEl.classList.add('hidden');
  }
});
</script>
